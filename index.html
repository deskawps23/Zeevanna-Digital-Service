<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#6C3CE1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Zeevanna Digital - Pandeglang</title>

    <!-- ===== Leaflet.js (Peta) ===== -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        /* ============================================================
               RESET & BASE
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f0f0f5;
            color: #1e1e2f;
            padding-bottom: 80px;
            overflow-x: hidden;
        }
        /* ============================================================
               HEADER
               ============================================================ */
        .header {
            background: linear-gradient(135deg, #6C3CE1, #8B5CF6);
            padding: 18px 16px 28px;
            border-radius: 0 0 28px 28px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .header-top .brand {
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-top .brand .badge-live {
            font-size: 10px;
            background: #ff4d4d;
            padding: 2px 8px;
            border-radius: 50px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .header-top .notif {
            font-size: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 50px;
            text-decoration: none;
            color: #fff;
            position: relative;
            z-index: 1;
        }
        .header-top .notif .dot {
            position: absolute;
            top: 2px;
            right: 6px;
            width: 8px;
            height: 8px;
            background: #ff4d4d;
            border-radius: 50%;
            border: 2px solid #6C3CE1;
            animation: pulse 1.5s infinite;
        }
        .header .greeting {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }
        .header .sub {
            font-size: 13px;
            opacity: 0.8;
            position: relative;
            z-index: 1;
        }
        .header .role-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }
        .header .location-info {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 4px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .location-info .dot-loc {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        /* ============================================================
               SALDO CARD
               ============================================================ */
        .saldo-card {
            background: #fff;
            margin: -16px 16px 16px;
            border-radius: 18px;
            padding: 16px 18px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(108, 60, 225, 0.08);
        }
        .saldo-card .item {
            text-align: center;
            flex: 1;
            min-width: 60px;
        }
        .saldo-card .label {
            font-size: 11px;
            color: #888;
        }
        .saldo-card .value {
            font-size: 18px;
            font-weight: 800;
            color: #6C3CE1;
        }
        .saldo-card .value.green {
            color: #25D366;
        }
        .saldo-card .value.gold {
            color: #F59E0B;
        }

        /* ============================================================
               STATUS GRID
               ============================================================ */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 0 16px 16px;
        }
        .status-item {
            background: #fff;
            border-radius: 14px;
            padding: 12px 6px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            text-decoration: none;
            color: #1e1e2f;
            transition: transform 0.2s;
            border: 1px solid transparent;
        }
        .status-item:active {
            transform: scale(0.95);
        }
        .status-item.active {
            border-color: #6C3CE1;
        }
        .status-item .icon {
            font-size: 24px;
            display: block;
        }
        .status-item .label {
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }
        .status-item .count {
            font-size: 10px;
            color: #6C3CE1;
            font-weight: 700;
            background: #f0edf9;
            padding: 0 8px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 2px;
        }

        /* ============================================================
               MENU GRID
               ============================================================ */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 0 16px 16px;
        }
        .menu-item {
            background: #fff;
            border-radius: 16px;
            padding: 14px 6px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            text-decoration: none;
            color: #1e1e2f;
            transition: transform 0.2s;
        }
        .menu-item:active {
            transform: scale(0.95);
        }
        .menu-item .icon {
            font-size: 26px;
            display: block;
        }
        .menu-item .label {
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* ============================================================
               SECTION
               ============================================================ */
        .section {
            padding: 0 16px 20px;
        }
        .section-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #1e1e2f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title a {
            font-size: 13px;
            color: #6C3CE1;
            text-decoration: none;
            font-weight: 600;
        }
        .section-title .badge-count {
            background: #6C3CE1;
            color: #fff;
            font-size: 11px;
            padding: 0 10px;
            border-radius: 50px;
        }

        /* ============================================================
               MAP (PETA)
               ============================================================ */
        #map {
            height: 280px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 12px;
            z-index: 1;
            position: relative;
            overflow: hidden;
        }
        .map-container {
            position: relative;
        }
        .map-container .map-overlay {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .map-container .map-overlay .pulse-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            display: inline-block;
        }

        /* ============================================================
               SERVICE LIST
               ============================================================ */
        .service-list {
            background: #fff;
            border-radius: 16px;
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .service-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f5;
        }
        .service-item:last-child {
            border-bottom: none;
        }
        .service-item .name {
            font-weight: 500;
            font-size: 14px;
        }
        .service-item .price {
            font-weight: 700;
            color: #6C3CE1;
            font-size: 14px;
        }
        .service-item .point {
            font-size: 11px;
            color: #F59E0B;
            font-weight: 600;
        }

        /* ============================================================
               BUTTON WA
               ============================================================ */
        .btn-wa {
            display: block;
            background: #25D366;
            color: #fff;
            padding: 16px;
            border: none;
            border-radius: 50px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            margin: 12px 0;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s;
        }
        .btn-wa:active {
            transform: scale(0.97);
        }

        /* ============================================================
               CONTACT GRID
               ============================================================ */
        .contact-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .contact-grid a {
            flex: 1 0 calc(50% - 10px);
            background: #fff;
            border: 1px solid #e8e8f0;
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            text-decoration: none;
            color: #1e1e2f;
            font-size: 13px;
            font-weight: 600;
        }

        /* ============================================================
               QRIS
               ============================================================ */
        .qr-container {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-top: 12px;
        }
        .qr-container .merchant {
            font-size: 16px;
            font-weight: 700;
            color: #6C3CE1;
        }
        .qr-container .location {
            font-size: 14px;
            color: #555;
            margin-top: 2px;
        }
        .qr-container .nmid {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
            margin-bottom: 10px;
        }
        .qr-container img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: 12px;
            background: #f5f5fa;
            padding: 8px;
            border: 1px solid #eee;
        }
        .qr-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        .qr-buttons a {
            background: #6C3CE1;
            color: #fff;
            padding: 8px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
        }
        .qr-buttons a.download {
            background: #25D366;
        }

        /* ============================================================
               EXTRA SERVICES
               ============================================================ */
        .extra-services {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }
        .extra-services span {
            background: #f0edf9;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 13px;
            color: #333;
            font-weight: 500;
        }

        /* ============================================================
               ORDER CARD
               ============================================================ */
        .order-card {
            background: #fff;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            border-left: 4px solid #6C3CE1;
            transition: transform 0.2s;
        }
        .order-card:active {
            transform: scale(0.98);
        }
        .order-card .info {
            font-size: 14px;
            flex: 2;
        }
        .order-card .info .name {
            font-weight: 600;
        }
        .order-card .info .desa {
            font-size: 12px;
            color: #888;
        }
        .order-card .info .point-earn {
            font-size: 11px;
            color: #F59E0B;
            font-weight: 600;
        }
        .order-card .info .distance {
            font-size: 11px;
            color: #6C3CE1;
            font-weight: 600;
        }
        .order-card .status {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 50px;
        }
        .order-card .status.done {
            background: #d4edda;
            color: #155724;
        }
        .order-card .status.pending {
            background: #fff3cd;
            color: #856404;
        }
        .order-card .status.process {
            background: #cce5ff;
            color: #004085;
        }
        .order-card .status.deliver {
            background: #d4edda;
            color: #155724;
        }
        .order-card .earning {
            font-weight: 700;
            color: #25D366;
            font-size: 14px;
        }

        /* ============================================================
               EARNING CARD
               ============================================================ */
        .earning-card {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-top: 10px;
        }
        .earning-card .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f5;
        }
        .earning-card .row:last-child {
            border-bottom: none;
        }
        .earning-card .label {
            font-size: 14px;
            color: #555;
        }
        .earning-card .value {
            font-weight: 700;
            font-size: 14px;
        }
        .earning-card .value.green {
            color: #25D366;
        }
        .earning-card .value.gold {
            color: #F59E0B;
        }
        .progress-bar {
            height: 8px;
            background: #f0f0f5;
            border-radius: 10px;
            margin: 6px 0 10px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #6C3CE1, #8B5CF6);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* ============================================================
               REGISTER FORM
               ============================================================ */
        .register-form {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .register-form input,
        .register-form select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e8e8f0;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 10px;
            font-family: inherit;
            background: #f8f8fc;
            transition: border 0.2s;
        }
        .register-form input:focus,
        .register-form select:focus {
            border-color: #6C3CE1;
            outline: none;
            background: #fff;
        }
        .register-form .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6C3CE1, #8B5CF6);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .register-form .btn-register:active {
            transform: scale(0.97);
        }
        .register-form .geo-status {
            font-size: 12px;
            color: #4ade80;
            text-align: center;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* ============================================================
               DESA GRID
               ============================================================ */
        .desa-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .desa-card {
            background: #fff;
            border-radius: 14px;
            padding: 12px 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s;
            cursor: pointer;
        }

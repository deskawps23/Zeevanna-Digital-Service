<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#6C3CE1">
    <title>Zeevanna Digital - Pandeglang</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f0f0f5;
            color: #1e1e2f;
            padding-bottom: 80px;
        }
        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #6C3CE1, #8B5CF6);
            padding: 18px 16px 28px;
            border-radius: 0 0 28px 28px;
            color: #fff;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-top .brand {
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-top .notif {
            font-size: 20px;
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 50px;
            text-decoration: none;
            color: #fff;
            position: relative;
        }
        .header-top .notif .dot {
            position: absolute;
            top: 2px;
            right: 6px;
            width: 8px;
            height: 8px;
            background: #ff4d4d;
            border-radius: 50%;
            border: 2px solid #6C3CE1;
        }
        .header .greeting {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 6px;
        }
        .header .sub {
            font-size: 13px;
            opacity: 0.8;
        }
        .header .role-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 2px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
        }

        /* ===== SALDO CARD (Gojek Style) ===== */
        .saldo-card {
            background: #fff;
            margin: -16px 16px 16px;
            border-radius: 18px;
            padding: 16px 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .saldo-card .item {
            text-align: center;
            flex: 1;
            min-width: 60px;
        }
        .saldo-card .label {
            font-size: 11px;
            color: #888;
        }
        .saldo-card .value {
            font-size: 18px;
            font-weight: 800;
            color: #6C3CE1;
        }
        .saldo-card .value.green {
            color: #25D366;
        }
        .saldo-card .value.gold {
            color: #F59E0B;
        }

        /* ===== STATUS GRID (seperti TikTok/Shopee) ===== */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 0 16px 16px;
        }
        .status-item {
            background: #fff;
            border-radius: 14px;
            padding: 12px 6px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            text-decoration: none;
            color: #1e1e2f;
            transition: transform 0.2s;
        }
        .status-item:active {
            transform: scale(0.95);
        }
        .status-item .icon {
            font-size: 24px;
            display: block;
        }
        .status-item .label {
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }
        .status-item .count {
            font-size: 10px;
            color: #6C3CE1;
            font-weight: 700;
            background: #f0edf9;
            padding: 0 8px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 2px;
        }

        /* ===== MENU GRID ===== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 0 16px 16px;
        }
        .menu-item {
            background: #fff;
            border-radius: 16px;
            padding: 14px 6px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            text-decoration: none;
            color: #1e1e2f;
            transition: transform 0.2s;
        }
        .menu-item:active {
            transform: scale(0.95);
        }
        .menu-item .icon {
            font-size: 26px;
            display: block;
        }
        .menu-item .label {
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* ===== SECTION ===== */
        .section {
            padding: 0 16px 20px;
        }
        .section-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #1e1e2f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title a {
            font-size: 13px;
            color: #6C3CE1;
            text-decoration: none;
            font-weight: 600;
        }
        .section-title .badge-count {
            background: #6C3CE1;
            color: #fff;
            font-size: 11px;
            padding: 0 10px;
            border-radius: 50px;
        }

        /* ===== SERVICE LIST ===== */
        .service-list {
            background: #fff;
            border-radius: 16px;
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .service-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f5;
        }
        .service-item:last-child {
            border-bottom: none;
        }
        .service-item .name {
            font-weight: 500;
            font-size: 14px;
        }
        .service-item .price {
            font-weight: 700;
            color: #6C3CE1;
            font-size: 14px;
        }
        .service-item .point {
            font-size: 11px;
            color: #F59E0B;
            font-weight: 600;
        }

        /* ===== BUTTON WA ===== */
        .btn-wa {
            display: block;
            background: #25D366;
            color: #fff;
            padding: 16px;
            border: none;
            border-radius: 50px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            margin: 12px 0;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s;
        }
        .btn-wa:active {
            transform: scale(0.97);
        }

        /* ===== CONTACT GRID ===== */
        .contact-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .contact-grid a {
            flex: 1 0 calc(50% - 10px);
            background: #fff;
            border: 1px solid #e8e8f0;
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            text-decoration: none;
            color: #1e1e2f;
            font-size: 13px;
            font-weight: 600;
        }

        /* ===== QRIS ===== */
        .qr-container {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-top: 12px;
        }
        .qr-container .merchant {
            font-size: 16px;
            font-weight: 700;
            color: #6C3CE1;
        }
        .qr-container .location {
            font-size: 14px;
            color: #555;
            margin-top: 2px;
        }
        .qr-container .nmid {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
            margin-bottom: 10px;
        }
        .qr-container img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: 12px;
            background: #f5f5fa;
            padding: 8px;
            border: 1px solid #eee;
        }
        .qr-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        .qr-buttons a {
            background: #6C3CE1;
            color: #fff;
            padding: 8px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
        }
        .qr-buttons a.download {
            background: #25D366;
        }

        /* ===== EXTRA SERVICES ===== */
        .extra-services {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }
        .extra-services span {
            background: #f0edf9;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 13px;
            color: #333;
            font-weight: 500;
        }

        /* ===== ORDER CARD ===== */
        .order-card {
            background: #fff;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .order-card .info {
            font-size: 14px;
            flex: 2;
        }
        .order-card .info .name {
            font-weight: 600;
        }
        .order-card .info .desa {
            font-size: 12px;
            color: #888;
        }
        .order-card .info .point-earn {
            font-size: 11px;
            color: #F59E0B;
            font-weight: 600;
        }
        .order-card .status {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 50px;
        }
        .order-card .status.done {
            background: #d4edda;
            color: #155724;
        }
        .order-card .status.pending {
            background: #fff3cd;
            color: #856404;
        }
        .order-card .status.process {
            background: #cce5ff;
            color: #004085;
        }
        .order-card .status.deliver {
            background: #d4edda;
            color: #155724;
        }
        .order-card .earning {
            font-weight: 700;
            color: #25D366;
            font-size: 14px;
        }

        /* ===== PAYROLL / EARNING CARD ===== */
        .earning-card {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-top: 10px;
        }
        .earning-card .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f5;
        }
        .earning-card .row:last-child {
            border-bottom: none;
        }
        .earning-card .label {
            font-size: 14px;
            color: #555;
        }
        .earning-card .value {
            font-weight: 700;
            font-size: 14px;
        }
        .earning-card .value.green {
            color: #25D366;
        }
        .earning-card .value.gold {
            color: #F59E0B;
        }
        .progress-bar {
            height: 8px;
            background: #f0f0f5;
            border-radius: 10px;
            margin: 6px 0 10px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #6C3CE1, #8B5CF6);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* ===== DAFTAR FORM ===== */
        .register-form {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .register-form input,
        .register-form select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e8e8f0;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 10px;
            font-family: inherit;
            background: #f8f8fc;
            transition: border 0.2s;
        }
        .register-form input:focus,
        .register-form select:focus {
            border-color: #6C3CE1;
            outline: none;
            background: #fff;
        }
        .register-form .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6C3CE1, #8B5CF6);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .register-form .btn-register:active {
            transform: scale(0.97);
        }

        /* ===== DESA GRID ===== */
        .desa-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .desa-card {
            background: #fff;
            border-radius: 14px;
            padding: 12px 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .desa-card .name {
            font-weight: 700;
            font-size: 14px;
        }
        .desa-card .kurir {
            font-size: 12px;
            color: #888;
        }
        .desa-card .count {
            font-size: 12px;
            color: #6C3CE1;
            font-weight: 600;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 6px 0 10px;
            border-top: 1px solid #eee;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
            z-index: 100;
        }
        .bottom-nav a {
            text-decoration: none;
            text-align: center;
            color: #999;
            font-size: 10px;
            font-weight: 600;
            flex: 1;
        }
        .bottom-nav a.active {
            color: #6C3CE1;
        }
        .bottom-nav a .icon {
            font-size: 22px;
            display: block;
            margin-bottom: 1px;
        }

        /* ===== FOOTER ===== */
        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #ccc;
            padding: 16px 0 6px;
        }
        .footer-text .credit {
            font-weight: 600;
            color: #6C3CE1;
        }

        /* ===== ROLE SWITCH ===== */
        .role-switch {
            display: flex;
            gap: 8px;
            padding: 0 16px 12px;
            overflow-x: auto;
            flex-wrap: nowrap;
        }
        .role-btn {
            padding: 6px 16px;
            border-radius: 50px;
            border: 2px solid #6C3CE1;
            background: transparent;
            color: #6C3CE1;
            font-weight: 700;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }
        .role-btn.active {
            background: #6C3CE1;
            color: #fff;
        }
        .role-btn:active {
            transform: scale(0.95);
        }

        /* ===== HIDDEN ===== */
        .hidden {
            display: none !important;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #1e1e2f;
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            z-index: 999;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 90%;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">✅ Berhasil!</div>

    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="header-top">
            <div class="brand">🧺 Zeevanna Digital</div>
            <a href="#" class="notif" id="notifBtn">
                🔔 <span class="dot"></span>
            </a>
        </div>
        <div class="greeting">👋 Selamat datang, <span id="userName">Admin Pusat</span></div>
        <div class="sub">Jasa Setrika & Laundry Online • Kab. Pandeglang</div>
        <span class="role-badge" id="roleBadge">👑 Admin</span>
    </div>

    <!-- ===== SALDO CARD (Gojek Style) ===== -->
    <div class="saldo-card">
        <div class="item">
            <div class="label">💰 Saldo</div>
            <div class="value" id="saldoValue">Rp 12.500.000</div>
        </div>
        <div class="item">
            <div class="label">⭐ Poin</div>
            <div class="value gold" id="poinValue">15.320</div>
        </div>
        <div class="item">
            <div class="label">📦 Pesanan</div>
            <div class="value" id="orderCount">1.247</div>
        </div>
    </div>

    <!-- ===== ROLE SWITCH ===== -->
    <div class="role-switch">
        <button class="role-btn active" data-role="admin">👑 Admin</button>
        <button class="role-btn" data-role="kurir">🚚 Kurir</button>
        <button class="role-btn" data-role="pekerja">🧺 Pekerja</button>
        <button class="role-btn" data-role="pelanggan">👤 Pelanggan</button>
    </div>

    <!-- ===== STATUS GRID ===== -->
    <div class="status-grid">
        <a href="#" class="status-item">
            <span class="icon">📦</span>
            <span class="label">Semua</span>
            <span class="count" id="countAll">1.247</span>
        </a>
        <a href="#" class="status-item">
            <span class="icon">⏳</span>
            <span class="label">Diproses</span>
            <span class="count" id="countProcess">342</span>
        </a>
        <a href="#" class="status-item">
            <span class="icon">🚚</span>
            <span class="label">Diantar</span>
            <span class="count" id="countDeliver">156</span>
        </a>
        <a href="#" class="status-item">
            <span class="icon">✅</span>
            <span class="label">Selesai</span>
            <span class="count" id="countDone">749</span>
        </a>
    </div>

    <!-- ===== MENU GRID ===== -->
    <div class="menu-grid">
        <a href="#pesan" class="menu-item">
            <span class="icon">📋</span>
            <span class="label">Pesan</span>
        </a>
        <a href="#daftar" class="menu-item">
            <span class="icon">📝</span>
            <span class="label">Daftar</span>
        </a>
        <a href="#payroll" class="menu-item">
            <span class="icon">💳</span>
            <span class="label">Payroll</span>
        </a>
        <a href="#kontak" class="menu-item">
            <span class="icon">📞</span>
            <span class="label">Kontak</span>
        </a>
    </d
